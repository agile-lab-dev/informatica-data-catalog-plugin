apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "informatica.fullname" . }}-config
  labels:
    {{- include "informatica.labels" . | nindent 4 }}
data:
  application.yml: |
    {{- if .Values.configOverride }}
    {{- .Values.configOverride | nindent 4 }}
    {{- else }}
    {{- .Files.Get "files/application.yml" | nindent 4 }}
    {{- end }}
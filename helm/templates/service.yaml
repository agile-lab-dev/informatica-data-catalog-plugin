apiVersion: v1
kind: Service
metadata:
  name: {{ include "informatica.fullname" . }}
  labels:
    {{- include "informatica.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "informatica.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    components:
      - fullyQualifiedName: Example Domain - Example Data Product - Output Port - stg_customers
        description: Example staging table for customers, normalized from the raw source.
        version: 0.0.0
        useCaseTemplateId: urn:dmb:utm:bigquery-outputport-template:0.0.0
        platform: BigQuery
        technology: BigQuery
        outputPortType: SQL
        dataContract:
          schema:
            - name: customer_id
              dataType: TEXT
              description: Example customer primary key.
              constraint: PRIMARY_KEY
              quality:
                - name: unique_customer_id
                  description: dbt test 'unique' on column customer_id
                  rule: unique
                  engine: dbt
                - name: not_null_customer_id
                  description: dbt test 'not_null' on column customer_id
                  rule: not_null
                  engine: dbt
            - name: email
              dataType: TEXT
              description: Example customer email address.
              constraint: PRIMARY_KEY
              quality:
                - name: unique_email
                  description: dbt test 'unique' on column email
                  rule: unique
                  engine: dbt
                - name: not_null_email
                  description: dbt test 'not_null' on column email
                  rule: not_null
                  engine: dbt
            - name: signup_date
              dataType: TEXT
              description: Example customer signup date.
              constraint: NOT_NULL
              quality:
                - name: not_null_signup_date
                  description: dbt test 'not_null' on column signup_date
                  rule: not_null
                  engine: dbt
            - name: country_code
              dataType: TEXT
              description: Example ISO country code for the customer.
              quality:
                - name: accepted_values_country_code
                  description: dbt test 'accepted_values' on column country_code
                  rule: accepted_values
                  engine: dbt
                  parameters:
                    values:
                      - IT
                      - FR
                      - DE
                      - ES
                      - US
          quality: []
        dataSharingAgreement:

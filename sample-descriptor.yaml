    description: test
    name: Customers
    fullyQualifiedName: Example Domain - Example Data Product - Customers
    version: 0.0.0
    infrastructureTemplateId: urn:dmb:itm:mock-outputport-tech-adapter:0
    useCaseTemplateId: urn:dmb:utm:bigquery-outputport-template:0.0.0
    dependsOn: []
    platform: BigQuery
    technology: BigQuery
    outputPortType: SQL
    __dataContractEnabled: true
    dataContract:
      schema:
        - name: customer_id
          dataType: TEXT
          description: Unique identifier for the record.
          constraint: PRIMARY_KEY
          quality:
            - name: unique_customer_id
              description: Checks that each identifier is unique.
              rule: unique
              engine: dbt
            - name: not_null_customer_id
              description: Checks that the identifier is present.
              rule: not_null
              engine: dbt
        - name: email
          dataType: TEXT
          description: Email address associated with the record.
          constraint: PRIMARY_KEY
          quality:
            - name: unique_email
              description: Checks that each email address is unique.
              rule: unique
              engine: dbt
            - name: not_null_email
              description: Checks that the email address is present.
              rule: not_null
              engine: dbt
        - name: signup_date
          dataType: TEXT
          description: Date associated with the record.
          constraint: NOT_NULL
          quality:
            - name: not_null_signup_date
              description: Checks that the date is present.
              rule: not_null
              engine: dbt
        - name: country_code
          dataType: TEXT
          description: Two-letter country code associated with the record.
          quality:
            - name: accepted_values_country_code
              description: Checks that the country code is one of the accepted values.
              rule: accepted_values
              engine: dbt
              parameters:
                values:
                  - IT
                  - FR
                  - DE
                  - ES
                  - US
      quality: []
    dataSharingAgreement:
      purpose: Foundational data for downstream use cases.
      billing: None.
      security: Platform standard security policies.
      intendedUsage: Any downstream use case.
      limitations: None.
      lifeCycle: Data refreshed daily and typically never deleted.
      confidentiality: None.
